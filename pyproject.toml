[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-reasoning-engine"
version = "0.1.0"
description = "A lightweight symbolic temporal reasoning engine for extracting, normalizing, and inferring temporal relations between events."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Didhiti Nahid", email = "didhiti.nahid@gmail.com" }
]
keywords = [
    "temporal-reasoning",
    "nlp",
    "natural-language-processing",
    "event-ordering",
    "temporal-relations",
    "symbolic-reasoning",
    "python"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
temporal-reasoning = "temporal_reasoning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
